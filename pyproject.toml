[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sera-learning"
version = "0.2.1"
description = "SERA: State-Space Engine for Reasoning and Adaptation"
authors = [{name = "Arnav123-s"}]
requires-python = ">=3.11"
dependencies = ["torch>=2.10,<2.11", "numpy>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
reports = ["matplotlib>=3.10,<4"]

[project.urls]
Repository = "https://github.com/Arnav123-s/sera"
Documentation = "https://github.com/Arnav123-s/sera#readme"

[project.scripts]
sera = "sera.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
