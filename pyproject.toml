[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sera-learning"
version = "0.5.0"
description = "SERA: State-Space Engine for Reasoning and Adaptation"
authors = [{name = "Arnav123-s"}]
requires-python = ">=3.11"
dependencies = ["torch>=2.10,<2.11", "numpy>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
reports = ["matplotlib>=3.10,<4"]
reference = ["scipy>=1.16,<2"]

[project.urls]
Repository = "https://github.com/Arnav123-s/sera"
Documentation = "https://github.com/Arnav123-s/sera#readme"

[project.scripts]
sera = "sera.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# These byte-fingerprinted, completed research protocols are preserved exactly.
# Exceptions concern import order, unused imports and short comprehension names;
# executable-error diagnostics remain enabled. New implementations use defaults.
[tool.ruff.lint.per-file-ignores]
"experiments/self_study/model.py" = ["I001"]
"experiments/self_study/multilingual.py" = ["I001", "E741"]
"experiments/self_study/prepare.py" = ["I001", "F401"]
"experiments/self_study/rehearsal.py" = ["I001", "E741"]
"experiments/self_study/study.py" = ["I001"]
"experiments/self_study/correction.py" = ["F401"]
"experiments/self_study/runtime.py" = ["E741"]
# Executed C01/C02 model/data bytes are part of the frozen checkpoint contract.
# Keep only their pre-existing import/statement formatting; error checks still run.
"experiments/concept_refinement/data.py" = ["I001"]
"experiments/concept_refinement/model.py" = ["I001"]
"experiments/concept_refinement/physical.py" = ["I001", "E702"]
