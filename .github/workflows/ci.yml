name: Verify SERA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      ATEN_CPU_CAPABILITY: avx2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      OPENBLAS_CORETYPE: Haswell
      NPY_DISABLE_CPU_FEATURES: X86_V4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.15'
          python-version: '3.12.14'
          enable-cache: false
      - run: python -m venv .venv
        if: runner.os == 'Linux'
      - run: uv venv --python 3.12.14
        if: runner.os == 'Windows'
      - run: uv pip install --python .venv torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install --python .venv -e ".[dev,reference]" numpy==2.5.3 scipy==1.18.1
      - run: uv run --no-sync python -m ruff check src tests scripts experiments
      - run: uv run --no-sync python scripts/restore_current.py
      - run: uv run --no-sync python -m scripts.portable_gap_use --input research-continuation/43_knowledge_gaps/example-tasks.json --output runs/ci-gap-examples.json
      - run: uv run --no-sync python -m scripts.solution_use --read-only --input research-continuation/44_solution_portfolios/example-tasks.json --output runs/ci-solution-examples.json
      - run: uv run --no-sync python -m scripts.counterfactual_live --input research-continuation/45_counterfactual_inquiry/example-tasks.json --output runs/ci-counterfactual-examples.json
      - run: uv run --no-sync python scripts/sera_current.py --input research-continuation/47_intervention_understanding/example-tasks.json --output runs/ci-current-examples.json
      - run: uv run --no-sync python -m experiments.concept_refinement.replay_diagnostic
      - run: uv run --no-sync python -m pytest
      - run: uv run --no-sync python scripts/verify_release.py
      - run: uv run --no-sync python scripts/verify_continuation.py
      - run: uv run --no-sync python scripts/verify_applicability.py
      - run: uv run --no-sync python scripts/verify_v3_release.py
      - run: uv run --no-sync python scripts/verify_transfer_release.py
      - run: uv run --no-sync python scripts/verify_continuing_release.py
      - run: uv run --no-sync python scripts/verify_concept_release.py
      - run: uv run --no-sync python -m sera --help
