name: Verify SERA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,reference]"
      - run: python -m ruff check src tests scripts experiments
      - run: python -m pytest
      - run: python scripts/verify_release.py
      - run: python scripts/verify_continuation.py
      - run: python scripts/verify_applicability.py
      - run: python scripts/verify_v3_release.py
      - run: python scripts/verify_transfer_release.py
      - run: python -m sera --help
